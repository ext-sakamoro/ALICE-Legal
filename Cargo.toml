[package]
name = "alice-legal"
publish = false
version = "0.3.0"
edition = "2021"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
description = "ALICE-Legal — Deterministic legal tree compilation, contract execution, administrative procedure events"
license = "LicenseRef-Proprietary"
repository = "https://github.com/ext-sakamoro/ALICE-Legal"

[dependencies]
alice-sign = { version = "0.1.0", git = "https://github.com/ext-sakamoro/ALICE-Sign", branch = "main", features = ["timestamp"] }
alice-zip = { version = "0.12", git = "https://github.com/ext-sakamoro/ALICE-Zip", branch = "main", default-features = false }

[lib]
name = "alice_legal"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = ["std"]
std = []
ffi = ["std"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
